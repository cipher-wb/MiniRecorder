<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>轻录 · Claude Code 风格</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --page: #E7E5DE;
    --page-grid: rgba(120,110,92,.07);
    --ui: 'Noto Sans SC', system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    background:
      linear-gradient(var(--page-grid) 1px, transparent 1px) 0 0 / 26px 26px,
      linear-gradient(90deg, var(--page-grid) 1px, transparent 1px) 0 0 / 26px 26px,
      var(--page);
    color: #2b2925;
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .stage { max-width: 980px; margin: 0 auto; padding: 56px 28px 120px; }

  /* header */
  .head { max-width: 680px; margin-bottom: 40px; }
  .kicker {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: #B0664A; font-weight: 600; margin-bottom: 14px;
  }
  .head h1 {
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 30px;
    line-height: 1.18; letter-spacing: -.01em; color: #211f1b; margin-bottom: 14px;
  }
  .lede { font-size: 14.5px; line-height: 1.7; color: #5f5b52; max-width: 600px; text-wrap: pretty; }
  .lede b { color: #B0664A; font-weight: 600; font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; }

  /* grid of two themes */
  .grid {
    display: grid; grid-template-columns: repeat(2, max-content);
    gap: 30px; justify-content: start; align-items: start;
  }
  .cell { display: flex; flex-direction: column; gap: 12px; }
  figcaption {
    display: flex; align-items: center; gap: 10px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  }
  .tag {
    font-weight: 600; padding: 3px 9px; border-radius: 5px; letter-spacing: .02em;
  }
  .tag.light { background: #FAF9F5; color: #2b2925; border: 1px solid #ddd9cc; }
  .tag.dark { background: #1A1815; color: #ECE9E0; }
  .hex { color: #9a9488; letter-spacing: .03em; }

  /* ============ the window ============ */
  .win {
    width: 340px;
    background: var(--bg);
    border-radius: 12px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    font-family: var(--mono);
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "calt" 0;
    overflow: hidden;
    user-select: none;
  }

  /* title bar */
  .bar {
    height: 42px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; background: var(--barbg); border-bottom: 1px solid var(--line);
  }
  .bar-l { display: flex; align-items: center; gap: 9px; }
  .logo {
    width: 18px; height: 18px; border-radius: 5px; background: var(--accent);
    display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.18);
  }
  .logo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); opacity: .92; }
  .brand { font-weight: 700; font-size: 13.5px; color: var(--t1); letter-spacing: .01em; }
  .brand-sub { font-size: 11px; color: var(--t3); letter-spacing: .04em; }
  .bar-r { display: flex; align-items: center; gap: 4px; }
  .wc {
    height: 22px; min-width: 22px; padding: 0 5px; border-radius: 5px;
    border: 1px solid transparent; background: transparent; color: var(--t2);
    font-family: var(--mono); font-size: 12px; cursor: pointer; line-height: 1;
    display: grid; place-items: center; transition: all .12s ease;
  }
  .wc:hover { background: color-mix(in srgb, var(--t1) 9%, transparent); color: var(--t1); }
  .wc.pin { font-size: 11px; letter-spacing: .02em; }
  .wc.pin.on {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--accent); border-color: color-mix(in srgb, var(--accent) 38%, transparent);
  }
  .wc.x:hover { background: #e0303a; color: #fff; }

  .body { padding: 13px 14px 14px; display: flex; flex-direction: column; }

  /* prompt line */
  .prompt {
    display: flex; align-items: center; gap: 7px; font-size: 12.5px;
    padding: 2px 2px 10px; color: var(--t2);
  }
  .ps1 { color: var(--accent); font-weight: 700; }
  .cmd { color: var(--t2); }
  .status { display: flex; align-items: center; gap: 6px; margin-left: 2px; }
  .sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--t3); }
  .d-recording { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .d-paused { background: #d99a30; }
  .sword { font-weight: 600; color: var(--t1); }
  .s-recording .sword { color: var(--accent); }
  .s-paused .sword { color: #d99a30; }
  .caret-blink { color: var(--accent); animation: blink 1.05s step-end infinite; margin-left: -2px; font-size: 12px; }
  .clock {
    margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: .04em;
    font-size: 12.5px; color: var(--t2); font-weight: 500;
  }
  .s-recording .clock { color: var(--t1); }

  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.78); } }
  @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }

  .rule { font-size: 12px; color: var(--line2); letter-spacing: 0; line-height: 1; padding: 2px 0 9px; overflow: hidden; white-space: nowrap; }
  .rule.dim { color: var(--line); padding: 9px 0; opacity: .8; }

  /* config rows */
  .config { display: flex; flex-direction: column; gap: 7px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .flag {
    width: 74px; flex-shrink: 0; font-size: 12px; color: var(--accent);
    font-weight: 500; letter-spacing: .1em;
  }
  .sel-wrap { position: relative; flex: 1; }
  .sel {
    width: 100%; display: flex; align-items: center; gap: 7px;
    background: var(--inset); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 10px; cursor: pointer; font-family: var(--mono);
    color: var(--t1); font-size: 12.5px; transition: border-color .12s ease, background .12s ease;
    text-align: left;
  }
  .sel:hover { border-color: var(--line2); }
  .sel.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--inset)); }
  .sel-val { font-weight: 500; }
  .sel-meta { font-size: 11px; color: var(--t3); }
  .caret { margin-left: auto; color: var(--t3); font-size: 11px; }
  .sel.region .edit { margin-left: auto; color: var(--accent); font-size: 11px; }

  .menu {
    position: absolute; top: calc(100% + 5px); left: 0; right: 0; z-index: 30;
    background: var(--menubg); border: 1px solid var(--line2); border-radius: 8px;
    box-shadow: var(--shadow); padding: 4px; overflow: hidden;
  }
  .opt {
    width: 100%; display: flex; align-items: center; gap: 7px; text-align: left;
    background: transparent; border: none; border-radius: 6px; cursor: pointer;
    padding: 7px 8px; font-family: var(--mono); color: var(--t1); font-size: 12.5px;
  }
  .opt:hover { background: color-mix(in srgb, var(--t1) 7%, transparent); }
  .opt.sel { color: var(--accent); }
  .opt-dot { width: 9px; color: var(--accent); font-weight: 700; }
  .opt-label { font-weight: 500; }
  .opt-meta { margin-left: auto; font-size: 11px; color: var(--t3); }

  /* record button */
  .record {
    margin-top: 12px; height: 42px; width: 100%; display: flex; align-items: center;
    gap: 10px; padding: 0 14px; border-radius: 9px; cursor: pointer;
    background: var(--accent); border: 1px solid transparent;
    color: var(--ink); font-family: var(--mono); font-size: 14px; font-weight: 600;
    transition: filter .12s ease, background .12s ease;
    box-shadow: 0 2px 10px -3px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .record:hover { filter: brightness(1.06); }
  .record:active { filter: brightness(.96); }
  .rec-ico { display: grid; place-items: center; width: 14px; }
  .g-rec { width: 11px; height: 11px; border-radius: 50%; background: currentColor; display: block; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 24%, transparent); }
  .g-stop { width: 10px; height: 10px; border-radius: 2px; background: currentColor; display: block; }
  .rec-label { letter-spacing: .02em; }
  .record.stop {
    background: var(--inset); color: var(--t1); border-color: var(--line2);
    box-shadow: none;
  }
  .record.stop:hover { filter: none; background: color-mix(in srgb, var(--t1) 5%, var(--inset)); }
  .record.stop .g-stop { background: var(--accent); }

  .kc {
    margin-left: auto; font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    padding: 2px 6px; border-radius: 5px; line-height: 1.3;
    background: color-mix(in srgb, var(--ink) 18%, transparent);
    border: 1px solid color-mix(in srgb, var(--ink) 26%, transparent);
    color: var(--ink); letter-spacing: .03em;
  }
  .record.stop .kc, .fbtn .kc {
    background: color-mix(in srgb, var(--t1) 7%, transparent);
    border-color: var(--line2); color: var(--t2);
  }
  .kc.sm { font-size: 10px; padding: 1px 5px; }

  /* footer */
  .footer { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
  .fgap { flex: 1; }
  .fbtn {
    display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 7px;
    background: transparent; border: 1px solid transparent; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--t2); transition: all .12s ease;
  }
  .fbtn:hover { background: color-mix(in srgb, var(--t1) 7%, transparent); color: var(--t1); border-color: var(--line); }
  .fbtn.off { opacity: .4; cursor: default; }
  .fbtn.off:hover { background: transparent; border-color: transparent; color: var(--t2); }
  .fbtn svg { color: currentColor; }

  /* pause / play glyphs */
  .g-pause { display: inline-flex; gap: 2.5px; }
  .g-pause i { width: 3px; height: 11px; border-radius: 1px; background: currentColor; display: block; }
  .g-play { width: 0; height: 0; border-left: 9px solid currentColor; border-top: 5.5px solid transparent; border-bottom: 5.5px solid transparent; display: block; }

  /* save toast */
  .saveline {
    height: 0; opacity: 0; overflow: hidden; display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; transition: height .2s ease, opacity .2s ease, margin .2s ease;
  }
  .saveline.show { height: 18px; opacity: 1; margin-top: 11px; }
  .saveline .ok { color: #5a9b6b; font-weight: 600; }
  .saveline .savemeta { color: var(--t3); }

  /* legend */
  .legend {
    display: flex; flex-wrap: wrap; gap: 18px; margin-top: 34px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #837d70;
  }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .lg-mono { background: repeating-linear-gradient(90deg, #b6b0a1 0 2px, transparent 2px 4px); }

  @media (max-width: 780px) {
    .grid { grid-template-columns: max-content; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
